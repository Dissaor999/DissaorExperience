<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE ARCHIVOS CLASIFICADOS</title>
    <style>
        /* Estética Forense y Hostil */
        :root {
            --term-green: #04d11f;
            --term-dark-green: #05bb14;
            --term-alert: #ff3333;
            --term-bg: #0e180c;
            --term-text: #d3d3d3;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--term-bg);
            color: var(--term-text);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Efecto de monitor CRT (Líneas de escaneo) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
            background-size: 100% 2px;
            z-index: 50;
            pointer-events: none;
        }

        #terminal {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 60px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #1a3818;
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #4a7547;
            gap: 10px;
            flex-wrap: wrap;
        }

        .case-selector-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #case-select-dropdown {
            background: #060e05;
            color: var(--term-green);
            border: 1px solid #1e451b;
            padding: 4px 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }

        #case-select-dropdown:focus {
            border-color: var(--term-green);
        }

        .header-bar a {
            color: #3b873a;
            text-decoration: none;
        }

        .header-bar a:hover {
            color: var(--term-green);
            text-decoration: underline;
        }

        p {
            margin: 6px 0;
            line-height: 1.5;
            word-break: break-word;
        }

        .sistema {
            color: var(--term-green);
        }

        .alerta {
            color: var(--term-alert);
            font-weight: bold;
        }

        .badge-warning {
            background: #440000;
            color: #ff6666;
            padding: 2px 6px;
            border: 1px solid #770000;
            font-size: 12px;
            display: inline-block;
        }

        /* Contenedores de Evidencias e Imágenes Protegidas */
        .evidence-container {
            margin: 15px 0;
            border: 1px solid #234321;
            background: #060c05;
            padding: 10px;
            max-width: 600px;
        }

        .image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            border: 1px solid #333;
            cursor: pointer;
        }

        .image-wrapper img {
            display: block;
            max-width: 100%;
            height: auto;
            filter: contrast(120%) grayscale(20%);
            pointer-events: none; /* Impide arrastrar directamente */
            -webkit-user-drag: none;
        }

        /* Capa transparente escudo que bloquea clic derecho y arrastre */
        .image-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.001);
            z-index: 10;
        }

        .image-hint {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #639360;
            margin-top: 6px;
        }

        .image-hint .btn-fullscreen {
            color: var(--term-green);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Embebidos de Google Docs / Álbumes */
        .doc-embed-box {
            margin: 15px 0;
            border: 1px solid #264a23;
            background: #081107;
            padding: 8px;
        }

        .doc-embed-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--term-green);
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 1px dotted #1d3b1b;
        }

        /* Marco de Álbum Forense - Google Photos Picker API */
        .album-frame-container {
            margin: 20px 0;
            border: 1px solid #1f4e1c;
            background: #040a03;
            padding: 12px;
            max-width: 820px;
            box-shadow: 0 0 20px rgba(4, 209, 31, 0.08);
            position: relative;
        }

        .album-frame-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #1d4019;
            padding-bottom: 8px;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .album-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--term-green);
            font-weight: bold;
        }

        .album-security-badge {
            background: #2a1103;
            color: #ff9d00;
            border: 1px solid #733c00;
            font-size: 11px;
            padding: 2px 6px;
            letter-spacing: 0.5px;
        }

        .album-header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-album-action {
            background: #0a1f08;
            color: var(--term-green);
            border: 1px solid #235220;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-album-action:hover {
            background: var(--term-green);
            color: #000;
        }

        .btn-album-action.btn-picker {
            border-color: #8be9fd;
            color: #8be9fd;
            background: #051924;
        }

        .btn-album-action.btn-picker:hover {
            background: #8be9fd;
            color: #000;
        }

        /* Escenario principal de la foto del álbum */
        .album-stage {
            position: relative;
            background: #020502;
            border: 1px solid #163613;
            padding: 10px;
            text-align: center;
        }

        .album-image-wrapper {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 440px;
            overflow: hidden;
            cursor: pointer;
        }

        .album-active-img {
            display: block;
            max-width: 100%;
            max-height: 440px;
            object-fit: contain;
            margin: 0 auto;
            filter: contrast(110%);
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        /* Capa Escudo Anti-Descarga transparente */
        .album-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            cursor: zoom-in;
        }

        .album-watermark {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: rgba(4, 209, 31, 0.8);
            font-size: 10px;
            padding: 2px 6px;
            border: 1px solid rgba(4, 209, 31, 0.3);
            pointer-events: none;
            z-index: 11;
            letter-spacing: 0.5px;
        }

        /* Barra de Controles del Álbum */
        .album-controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 6px 10px;
            background: #060e05;
            border: 1px solid #153112;
        }

        .btn-album-nav {
            background: #0d220a;
            color: var(--term-green);
            border: 1px solid #1f471b;
            padding: 4px 12px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-album-nav:hover:not(:disabled) {
            background: var(--term-green);
            color: #000;
        }

        .btn-album-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .album-counter {
            font-size: 12px;
            color: #79a877;
            font-weight: bold;
        }

        .album-photo-caption {
            font-size: 13px;
            color: #9ecc9a;
            margin-top: 8px;
            min-height: 20px;
            line-height: 1.4;
        }

        /* Tira de Miniaturas */
        .album-thumbnails-strip {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            overflow-x: auto;
            padding: 6px 2px;
        }

        .album-thumb-item {
            position: relative;
            width: 72px;
            height: 52px;
            flex-shrink: 0;
            border: 1px solid #1c3b1a;
            cursor: pointer;
            overflow: hidden;
            background: #000;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .album-thumb-item.active {
            border-color: var(--term-green);
            opacity: 1;
            box-shadow: 0 0 8px rgba(4, 209, 31, 0.4);
        }

        .album-thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .album-thumb-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .album-footer-note {
            font-size: 12px;
            color: #5b8758;
            margin-top: 8px;
            font-style: italic;
        }

        /* Interfaz de Comando */
        #linea-comando {
            display: flex;
            align-items: center;
            margin-top: 15px;
        }

        #comando {
            background: transparent;
            border: none;
            color: var(--term-dark-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            width: 100%;
            outline: none;
            margin-left: 10px;
        }

        /* Modal Fullscreen Protegido para Álbumes y Fotos */
        /* Modal Fullscreen Total sin Container para que la foto ocupe la mayor parte de la pantalla */
        #lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        #lightbox-modal.active {
            display: flex;
        }

        /* Foto que ocupa la totalidad de la pantalla */
        .lightbox-img {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            border: none;
            box-shadow: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-select: none;
        }

        /* Barra de herramientas flotante superior - Oculta para pantalla completa limpia */
        .lightbox-toolbar {
            display: none !important;
        }

        /* Botón discreto de cierre en esquina superior derecha */
        .lightbox-close-btn {
            position: fixed;
            top: 18px;
            right: 22px;
            background: rgba(0, 0, 0, 0.55);
            color: var(--term-green);
            border: 1px solid rgba(4, 209, 31, 0.4);
            width: 40px;
            height: 40px;
            font-size: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10020;
            transition: all 0.2s;
            opacity: 0.6;
            font-family: monospace;
            line-height: 1;
        }

        .lightbox-close-btn:hover {
            opacity: 1;
            background: var(--term-green);
            color: #000;
            box-shadow: 0 0 15px rgba(4, 209, 31, 0.6);
        }

        /* Botones Flotantes de Navegación en Pantalla Completa a los extremos */
        .lightbox-nav-btn {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(6, 16, 5, 0.7);
            color: var(--term-green);
            border: 1px solid rgba(4, 209, 31, 0.4);
            font-size: 32px;
            padding: 18px 22px;
            cursor: pointer;
            z-index: 10020;
            transition: all 0.2s;
            user-select: none;
            border-radius: 4px;
        }

        .lightbox-nav-btn:hover {
            background: var(--term-green);
            color: #000;
            box-shadow: 0 0 20px rgba(4, 209, 31, 0.6);
        }

        .btn-lightbox-prev {
            left: 15px;
        }

        .btn-lightbox-next {
            right: 15px;
        }

        /* Capa transparente indestructible que cubre el 100% de la pantalla protegiendo contra descargas */
        .lightbox-anti-download-guard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: transparent;
            cursor: default;
            z-index: 10005;
        }

        /* Ocultar pie de foto y watermark para que solo se vea la foto y los botones siguiente/anterior */
        .lightbox-watermark {
            display: none !important;
        }

        .lightbox-caption {
            display: none !important;
        }

        /* Modal o Prompt de Contraseña */
        #pwd-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 8000;
            justify-content: center;
            align-items: center;
        }

        #pwd-modal.active {
            display: flex;
        }

        .pwd-card {
            background: #0e180c;
            border: 2px solid var(--term-green);
            padding: 25px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 25px rgba(4, 209, 31, 0.25);
        }

        .pwd-card h3 {
            margin-top: 0;
            color: var(--term-green);
            font-size: 16px;
            border-bottom: 1px dashed #204b1e;
            padding-bottom: 8px;
        }

        .pwd-card input {
            width: 100%;
            background: #050a04;
            border: 1px solid var(--term-green);
            color: #fff;
            padding: 10px;
            font-family: inherit;
            font-size: 16px;
            margin: 12px 0;
            outline: none;
        }

        .pwd-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .pwd-btn {
            background: #142a12;
            color: var(--term-green);
            border: 1px solid var(--term-green);
            padding: 6px 14px;
            font-family: inherit;
            cursor: pointer;
        }

        .pwd-btn:hover {
            background: var(--term-green);
            color: #000;
        }
    </style>
</head>

<body oncontextmenu="return false;">
    <div id="terminal">
        <div class="header-bar">
            <div class="case-selector-wrapper" id="case-header-container">
                <span id="case-status-indicator">[SECTOR FORENSE ACTIVO]</span>
                <select id="case-select-dropdown" style="display:none;"></select>
            </div>
            <div id="operator-info-container">
                <span id="operator-badge" style="display:none; color:#72c2ff; margin-right:12px;"></span>
                <span>Acceso admin: <span style="color:#04d11f">login [usuario]</span></span>
            </div>
        </div>

        <div id="historial">
            <p class="sistema" id="sys-header">SISTEMA DE ARCHIVOS CLASIFICADOS V.1.03</p>
            <p class="sistema" id="conn-msg">Conexión cifrada establecida.</p>
            <p id="initial-hint">Escriba 'ayuda' para continuar.</p>
        </div>

        <div id="linea-comando">
            <span>&gt; </span>
            <input type="text" id="comando" autocomplete="off" autofocus spellcheck="false">
        </div>
    </div>

    <!-- Visor Pantalla Completa Protegido para Álbumes e Imágenes (Solo Foto y Botones Adelante/Atrás) -->
    <div id="lightbox-modal">
        <!-- Botón discreto de cierre en esquina -->
        <button class="lightbox-close-btn" id="btn-close-lightbox" title="Cerrar pantalla completa (Escape)">✕</button>

        <!-- Botones flotantes siguiente y anterior -->
        <button class="lightbox-nav-btn btn-lightbox-prev" id="btn-lightbox-prev" title="Foto anterior (Flecha Izquierda)">❮</button>
        <button class="lightbox-nav-btn btn-lightbox-next" id="btn-lightbox-next" title="Foto siguiente (Flecha Derecha)">❯</button>

        <!-- Foto que ocupa toda la pantalla de forma directa y sin container -->
        <img class="lightbox-img" id="lightbox-img" src="" alt="Evidencia Forense" draggable="false">
        <div class="lightbox-anti-download-guard" id="lightbox-guard" title="Archivo clasificado protegido contra descarga"></div>

        <!-- Elementos de metadatos ocultos (evita errores en JS) -->
        <div class="lightbox-toolbar" style="display:none !important;">
            <span id="lightbox-album-title"></span>
            <span id="lightbox-photo-counter"></span>
        </div>
        <div class="lightbox-caption" id="lightbox-caption" style="display:none !important;"></div>
        <div class="lightbox-watermark" style="display:none !important;"></div>
    </div>

    <!-- Prompt de Clave para Login desde Terminal -->
    <div id="pwd-modal">
        <div class="pwd-card">
            <h3 id="pwd-modal-title">[CONTROL DE IDENTIDAD]</h3>
            <p id="pwd-modal-desc" style="font-size:14px; color:#aaa;">Ingrese su clave de autorización:</p>
            <input type="password" id="pwd-input" autocomplete="off" placeholder="••••••••">
            <div id="pwd-error" style="color:var(--term-alert); font-size:13px; margin-bottom:10px; display:none;"></div>
            <div class="pwd-buttons">
                <button class="pwd-btn" id="pwd-cancel">Cancelar</button>
                <button class="pwd-btn" id="pwd-submit">Verificar</button>
            </div>
        </div>
    </div>

    <script>
        const inputComando = document.getElementById('comando');
        const historial = document.getElementById('historial');
        const sysHeader = document.getElementById('sys-header');
        const connMsg = document.getElementById('conn-msg');
        const initialHint = document.getElementById('initial-hint');

        // Lightbox
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const btnCloseLightbox = document.getElementById('btn-close-lightbox');
        const btnLightboxPrev = document.getElementById('btn-lightbox-prev');
        const btnLightboxNext = document.getElementById('btn-lightbox-next');
        const lightboxAlbumTitle = document.getElementById('lightbox-album-title');
        const lightboxPhotoCounter = document.getElementById('lightbox-photo-counter');

        let activeAlbumPhotos = [];
        let activeAlbumIndex = 0;
        let activeAlbumTitle = '';

        // Password Modal
        const pwdModal = document.getElementById('pwd-modal');
        const pwdInput = document.getElementById('pwd-input');
        const pwdModalTitle = document.getElementById('pwd-modal-title');
        const pwdModalDesc = document.getElementById('pwd-modal-desc');
        const pwdError = document.getElementById('pwd-error');
        const pwdSubmit = document.getElementById('pwd-submit');
        const pwdCancel = document.getElementById('pwd-cancel');

        const caseStatusIndicator = document.getElementById('case-status-indicator');
        const caseSelectDropdown = document.getElementById('case-select-dropdown');
        const operatorBadge = document.getElementById('operator-badge');

        let currentCaseId = 1;
        let faseDegradacion = 1;
        let pendingLoginUsername = null;
        let accessibleCases = [];

        // Mantener el foco
        document.addEventListener('click', (e) => {
            if (!pwdModal.classList.contains('active') && !lightboxModal.classList.contains('active') && e.target !== caseSelectDropdown) {
                inputComando.focus();
            }
        });

        // Bloqueo global estricto de clic derecho e inspect / atajos de guardado
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            imprimir('[SEGURIDAD FORENSE] Descarga bloqueada. Este material fotográfico está protegido contra copia o reproducción.', 'alerta');
        });

        window.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });

        window.addEventListener('keydown', (e) => {
            // Escape cierra modales
            if (e.key === 'Escape') {
                closeLightbox();
                closePwdModal();
            }

            // Flechas de navegación en Lightbox / Fullscreen
            if (lightboxModal.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    prevLightboxPhoto();
                } else if (e.key === 'ArrowRight') {
                    nextLightboxPhoto();
                }
            }

            // Bloquear atajos de guardado, impresión o inspección (Ctrl+S, Cmd+S, Ctrl+P, Ctrl+U)
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S' || e.key === 'p' || e.key === 'P' || e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
                imprimir('[SEGURIDAD FORENSE] Acción bloqueada: Descarga o impresión no autorizada.', 'alerta');
            }
        });

        function imprimir(texto, clase = '') {
            const parrafo = document.createElement('p');
            parrafo.innerHTML = texto;
            if (clase) parrafo.className = clase;
            historial.appendChild(parrafo);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function simularCarga(textoFinal, elementoHTML, retraso = 2500) {
            const pCarga = document.createElement('p');
            pCarga.className = 'sistema';
            pCarga.innerText = "Desencriptando sector forense... [██████░░░░]";
            historial.appendChild(pCarga);
            window.scrollTo(0, document.body.scrollHeight);

            setTimeout(() => {
                pCarga.innerText = "Desencriptando sector forense... [██████████] 100%";
                if (textoFinal) imprimir(textoFinal);
                if (elementoHTML) {
                    historial.appendChild(elementoHTML);
                    window.scrollTo(0, document.body.scrollHeight);
                }
            }, retraso);
        }

        // Cargar caso específico
        async function aplicarCaso(c) {
            currentCaseId = c.id;
            faseDegradacion = 1;
            if (c.system_header) sysHeader.innerText = c.system_header;
            if (c.connection_msg) connMsg.innerText = c.connection_msg;
            if (c.initial_hint) initialHint.innerHTML = c.initial_hint;
        }

        // Configurar indicador de expediente o selectBox según la cantidad
        async function actualizarSelectorExpedientes() {
            try {
                // Verificar si hay token almacenado
                const token = sessionStorage.getItem('admin_token');
                const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

                const res = await fetch('/api/terminal/cases', { headers });
                if (!res.ok) return;

                const data = await res.json();
                accessibleCases = data.cases || [];

                if (data.session) {
                    let operatorText = `[OPERADOR: ${data.session.username.toUpperCase()}]`;
                    if (data.session.role === 'entrañable') {
                        operatorText = `[OPERADOR ENTRAÑABLE: ${data.session.username.toUpperCase()} // OCUPADO]`;
                        operatorBadge.style.color = '#ffb86c';
                        operatorBadge.style.borderColor = '#ffb86c';
                    } else {
                        operatorBadge.style.color = '#4a7547';
                        operatorBadge.style.borderColor = '#1a3818';
                    }
                    operatorBadge.innerText = operatorText;
                    operatorBadge.style.display = 'inline';
                } else {
                    operatorBadge.style.display = 'none';
                }

                if (accessibleCases.length === 1) {
                    // Exactamente UN expediente: sustituir [SECTOR FORENSE ACTIVO] por el nombre del expediente
                    const unicoCaso = accessibleCases[0];
                    caseStatusIndicator.innerText = `[${unicoCaso.title.toUpperCase()}]`;
                    caseStatusIndicator.style.display = 'inline';
                    caseSelectDropdown.style.display = 'none';
                    await cargarCasoPorId(unicoCaso.id);

                } else if (accessibleCases.length > 1) {
                    // MÁS DE UN expediente: mostrar un SelectBox con todos los accesibles
                    caseStatusIndicator.style.display = 'none';
                    caseSelectDropdown.innerHTML = '';

                    accessibleCases.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id;
                        opt.textContent = `📁 ${c.title}`;
                        if (c.id === currentCaseId) opt.selected = true;
                        caseSelectDropdown.appendChild(opt);
                    });

                    caseSelectDropdown.style.display = 'inline-block';
                    
                    // Si el caso actual no está en la lista de accesibles, usar el primero
                    if (!accessibleCases.some(c => c.id === currentCaseId)) {
                        await cargarCasoPorId(accessibleCases[0].id);
                    }
                } else {
                    caseStatusIndicator.innerText = '[SIN EXPEDIENTES ASIGNADOS]';
                    caseStatusIndicator.style.display = 'inline';
                    caseSelectDropdown.style.display = 'none';
                }
            } catch (err) {
                console.warn('Error al verificar expedientes accesibles:', err);
            }
        }

        caseSelectDropdown.addEventListener('change', async (e) => {
            const selectedId = parseInt(e.target.value, 10);
            await cargarCasoPorId(selectedId);
            imprimir(`[SISTEMA] Expediente cambiado a: <b>${caseSelectDropdown.options[caseSelectDropdown.selectedIndex].text}</b>`, 'sistema');
            inputComando.focus();
        });

        async function cargarCasoPorId(caseId) {
            try {
                const res = await fetch(`/api/case/current?case_id=${caseId}`);
                if (res.ok) {
                    const data = await res.json();
                    aplicarCaso(data);
                }
            } catch (err) {
                console.warn('Error cargando caso:', err);
            }
        }

        // Cargar caso activo desde el backend SQLite
        async function cargarCasoActivo() {
            try {
                const res = await fetch('/api/case/current');
                if (res.ok) {
                    const data = await res.json();
                    currentCaseId = data.id;
                    aplicarCaso(data);
                }
                await actualizarSelectorExpedientes();
            } catch (err) {
                console.warn('Servidor offline o inicializando...', err);
            }
        }
        cargarCasoActivo();

        // Control de Lightbox protegido y visor a Pantalla Completa
        function openLightboxAlbum(photos, startIndex = 0, title = 'Álbum Forense') {
            if (!photos || photos.length === 0) return;
            activeAlbumPhotos = photos;
            activeAlbumIndex = Math.max(0, Math.min(startIndex, photos.length - 1));
            activeAlbumTitle = title;
            updateLightboxView();
            lightboxModal.classList.add('active');
        }

        function updateLightboxView() {
            if (activeAlbumPhotos.length === 0) return;
            const photo = activeAlbumPhotos[activeAlbumIndex];
            lightboxImg.src = photo.url;
            lightboxCaption.innerHTML = `<b>${photo.title || 'Evidencia'}</b>${photo.caption ? ': ' + photo.caption : ''}`;
            lightboxAlbumTitle.innerText = `[${activeAlbumTitle.toUpperCase()}]`;
            lightboxPhotoCounter.innerText = `[FOTO ${activeAlbumIndex + 1} DE ${activeAlbumPhotos.length}]`;

            // Mostrar u ocultar flechas si solo hay 1 foto
            if (activeAlbumPhotos.length > 1) {
                btnLightboxPrev.style.display = 'block';
                btnLightboxNext.style.display = 'block';
            } else {
                btnLightboxPrev.style.display = 'none';
                btnLightboxNext.style.display = 'none';
            }
        }

        function prevLightboxPhoto() {
            if (activeAlbumPhotos.length <= 1) return;
            activeAlbumIndex = (activeAlbumIndex - 1 + activeAlbumPhotos.length) % activeAlbumPhotos.length;
            updateLightboxView();
        }

        function nextLightboxPhoto() {
            if (activeAlbumPhotos.length <= 1) return;
            activeAlbumIndex = (activeAlbumIndex + 1) % activeAlbumPhotos.length;
            updateLightboxView();
        }

        btnLightboxPrev.addEventListener('click', (e) => {
            e.stopPropagation();
            prevLightboxPhoto();
        });

        btnLightboxNext.addEventListener('click', (e) => {
            e.stopPropagation();
            nextLightboxPhoto();
        });

        // Compatibilidad con openLightbox simple
        function openLightbox(url, caption) {
            openLightboxAlbum([{ url, title: 'Evidencia Fotográfica', caption }], 0, 'Evidencia Individual');
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active');
            lightboxImg.src = '';
            inputComando.focus();
        }

        btnCloseLightbox.addEventListener('click', closeLightbox);
        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal || e.target.classList.contains('lightbox-anti-download-guard')) {
                closeLightbox();
            }
        });

        // Control de Modal Login
        function openPwdModal(username) {
            pendingLoginUsername = username;
            pwdModalTitle.innerText = `[IDENTIFICACIÓN: ${username.toUpperCase()}]`;
            pwdModalDesc.innerText = `Ingrese la clave de seguridad para el operador '${username}':`;
            pwdError.style.display = 'none';
            pwdInput.value = '';
            pwdModal.classList.add('active');
            setTimeout(() => pwdInput.focus(), 100);
        }

        function closePwdModal() {
            pwdModal.classList.remove('active');
            pendingLoginUsername = null;
            inputComando.focus();
        }

        pwdCancel.addEventListener('click', closePwdModal);

        pwdSubmit.addEventListener('click', async () => {
            const pwd = pwdInput.value;
            if (!pwd) return;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: pendingLoginUsername, password: pwd })
                });

                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('admin_token', data.token);
                    sessionStorage.setItem('admin_user', JSON.stringify(data.user));

                    if (data.user.role === 'admin' || data.user.role === 'superadmin') {
                        imprimir(`[AUTORIZADO] Bienvenido Administrador ${data.user.username}. Redirigiendo a consola de administración...`, 'sistema');
                        closePwdModal();
                        setTimeout(() => {
                            window.location.href = '/admin';
                        }, 1200);
                    } else {
                        // Es un Operador: no tiene acceso al admin, se queda en la terminal desbloqueando sus expedientes
                        let welcomeMsg = `[AUTORIZADO] Operador ${data.user.username} autenticado en el sistema. Expedientes cargados.`;
                        if (data.user.role === 'entrañable') {
                            welcomeMsg = `[AUTORIZADO // PROTOCOLO ENTRAÑABLE]<br>Operador especial <b>${data.user.username.toUpperCase()}</b> conectado al sector forense.<br>Variables heurísticas y respuestas de personaje activadas.<br><span style="color:#ffb86c;">[ESTADO: OCUPADO E IRREPETIBLE]</span>`;
                        }
                        imprimir(welcomeMsg, 'sistema');
                        closePwdModal();
                        await actualizarSelectorExpedientes();
                    }
                } else {
                    pwdError.innerText = data.error || 'Clave denegada.';
                    pwdError.style.display = 'block';
                    pwdInput.value = '';
                    pwdInput.focus();
                }
            } catch (err) {
                pwdError.innerText = 'Error de enlace con el servidor de autenticación.';
                pwdError.style.display = 'block';
            }
        });

        pwdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') pwdSubmit.click();
        });

        // Crear elemento de imagen protegida para el terminal
        function crearElementoImagen(url, caption = '') {
            const container = document.createElement('div');
            container.className = 'evidence-container';

            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = url;
            img.alt = caption || 'Evidencia';
            img.draggable = false;

            const shield = document.createElement('div');
            shield.className = 'image-shield';
            shield.title = 'Haga click para vista a pantalla completa';

            wrapper.appendChild(img);
            wrapper.appendChild(shield);

            const hint = document.createElement('div');
            hint.className = 'image-hint';
            hint.innerHTML = `<span>[REGISTRO FOTOGRÁFICO - DESCARGA RESTRINGIDA]</span>
                              <span class="btn-fullscreen">🔍 PANTALLA COMPLETA</span>`;

            const triggerFullscreen = () => openLightbox(url, caption);
            shield.addEventListener('click', triggerFullscreen);
            hint.querySelector('.btn-fullscreen').addEventListener('click', triggerFullscreen);

            container.appendChild(wrapper);
            container.appendChild(hint);
            return container;
        }

        // Crear Marco de Álbum Forense protegido (Google Photos Picker API)
        function crearElementoAlbum(payload) {
            const albumTitle = payload.title || 'Álbum Forense de Evidencias';
            const albumCaption = payload.caption || '';
            
            // Normalizar fotos
            let photos = [];
            if (Array.isArray(payload.photos) && payload.photos.length > 0) {
                photos = payload.photos.map((p, idx) => {
                    if (typeof p === 'string') {
                        return { url: p, title: `Evidencia #${idx + 1}`, caption: '' };
                    }
                    return {
                        url: p.url || '/ted.jpeg',
                        title: p.title || `Evidencia #${idx + 1}`,
                        caption: p.caption || ''
                    };
                });
            } else if (payload.embedUrl && !payload.embedUrl.includes('docs.google.com') && !payload.embedUrl.includes('photos.google.com')) {
                photos = [{ url: payload.embedUrl, title: albumTitle, caption: albumCaption }];
            } else {
                // Fallback / Preset pericial de alta resolución
                photos = [
                    {
                        url: '/ted.jpeg',
                        title: 'Evidencia KODAK #04 - Lago Sammamish 1974',
                        caption: 'Sujeto avistado con yeso en el brazo izquierdo solicitando auxilio para velero.'
                    },
                    {
                        url: 'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=1200&q=80',
                        title: 'Minuta Forense - Protocolo de Necropsia 74-B',
                        caption: 'Documento pericial oficial digitalizado. Registro clasificado del médico legista.'
                    },
                    {
                        url: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=1200&q=80',
                        title: 'Peritaje Balístico - Perímetro Este',
                        caption: 'Marcas de neumáticos y levantamiento pericial en zona de picnic.'
                    }
                ];
            }

            let currentIndex = 0;

            const container = document.createElement('div');
            container.className = 'album-frame-container';

            container.innerHTML = `
                <div class="album-frame-header">
                    <div class="album-title-group">
                        <span style="font-size:16px;">📁</span>
                        <span class="album-heading">[MARCO DE ÁLBUM FORENSE: ${albumTitle.toUpperCase()}]</span>
                        <span class="album-security-badge">🛡️ ANTI-DESCARGA ACTIVO</span>
                    </div>
                    <div class="album-header-actions">
                        <button class="btn-album-action btn-trigger-fullscreen" title="Ver álbum a pantalla completa">🔍 PANTALLA COMPLETA</button>
                    </div>
                </div>

                <div class="album-stage">
                    <div class="album-image-wrapper">
                        <img class="album-active-img" src="${photos[currentIndex].url}" alt="Evidencia" draggable="false">
                        <div class="album-shield" title="Haga clic para ver a pantalla completa"></div>
                        <div class="album-watermark">CONFIDENCIAL // REGISTRO FORENSE - DESCARGA RESTRINGIDA</div>
                    </div>

                    <div class="album-controls-bar">
                        <div class="album-counter">FOTO <span class="counter-cur">1</span> DE <span class="counter-tot">${photos.length}</span></div>
                    </div>
                    <div class="album-photo-caption"><b>${photos[currentIndex].title}</b>${photos[currentIndex].caption ? ': ' + photos[currentIndex].caption : ''}</div>
                </div>

                <div class="album-thumbnails-strip"></div>
                ${albumCaption ? `<div class="album-footer-note">${albumCaption}</div>` : ''}
            `;

            const activeImg = container.querySelector('.album-active-img');
            const shield = container.querySelector('.album-shield');
            const captionEl = container.querySelector('.album-photo-caption');
            const counterCur = container.querySelector('.counter-cur');
            const counterTot = container.querySelector('.counter-tot');
            const thumbsStrip = container.querySelector('.album-thumbnails-strip');
            const btnFullscreen = container.querySelector('.btn-trigger-fullscreen');

            function renderThumbnails() {
                thumbsStrip.innerHTML = '';
                photos.forEach((p, idx) => {
                    const thumb = document.createElement('div');
                    thumb.className = `album-thumb-item ${idx === currentIndex ? 'active' : ''}`;
                    thumb.title = p.title || `Foto #${idx + 1}`;
                    thumb.innerHTML = `
                        <img src="${p.thumbUrl || p.url}" alt="Miniatura" draggable="false">
                        <div class="album-thumb-shield"></div>
                    `;
                    thumb.addEventListener('click', () => {
                        setPhoto(idx);
                    });
                    thumbsStrip.appendChild(thumb);
                });
            }

            function setPhoto(idx) {
                currentIndex = (idx + photos.length) % photos.length;
                const photo = photos[currentIndex];
                activeImg.src = photo.url;
                captionEl.innerHTML = `<b>${photo.title || 'Evidencia'}</b>${photo.caption ? ': ' + photo.caption : ''}`;
                counterCur.innerText = currentIndex + 1;
                counterTot.innerText = photos.length;

                // Actualizar miniaturas
                const thumbs = thumbsStrip.querySelectorAll('.album-thumb-item');
                thumbs.forEach((t, i) => {
                    if (i === currentIndex) t.classList.add('active');
                    else t.classList.remove('active');
                });
            }

            // Fullscreen click en imagen o botón
            const triggerFullscreen = () => openLightboxAlbum(photos, currentIndex, albumTitle);
            shield.addEventListener('click', triggerFullscreen);
            btnFullscreen.addEventListener('click', triggerFullscreen);

            renderThumbnails();
            return container;
        }

        // Compatibilidad con invocaciones antiguas
        function crearElementoDoc(url, title = 'Documento Enlazado', caption = '') {
            return crearElementoAlbum({ embedUrl: url, title, caption });
        }

        // Procesamiento de comandos
        inputComando.addEventListener('keydown', async function (event) {
            if (event.key === 'Enter') {
                const comandoEscrito = this.value;
                const comandoLimpio = comandoEscrito.trim();
                if (!comandoLimpio) return;

                imprimir(`&gt; ${comandoEscrito}`, 'sistema');
                this.value = '';

                // Comando especial local 'clear'
                if (comandoLimpio.toLowerCase() === 'clear') {
                    historial.innerHTML = '';
                    return;
                }

                try {
                    const token = sessionStorage.getItem('admin_token');
                    const userStr = sessionStorage.getItem('admin_user');
                    let activeOperator = null;
                    if (userStr) {
                        try { activeOperator = JSON.parse(userStr).username; } catch (e) {}
                    }
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const res = await fetch('/api/command', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({
                            command: comandoLimpio,
                            case_id: currentCaseId,
                            current_phase: faseDegradacion,
                            operator: activeOperator
                        })
                    });

                    const data = await res.json();

                    // Si el comando solicita login
                    if (data.type === 'login_prompt') {
                        imprimir(data.payload.prompt, 'sistema');
                        openPwdModal(data.payload.username);
                        return;
                    }

                    // Si el comando solicita logout
                    if (data.type === 'logout_action') {
                        sessionStorage.removeItem('admin_token');
                        sessionStorage.removeItem('admin_user');
                        imprimir(data.payload.text, 'sistema');
                        await actualizarSelectorExpedientes();
                        return;
                    }

                    // Actualizar fase si el comando la altera
                    if (data.next_phase && data.next_phase > 0) {
                        faseDegradacion = data.next_phase;
                    }

                    // Manejo según tipo de respuesta
                    if (data.type === 'text') {
                        imprimir(data.payload.text, data.payload.alert ? 'alerta' : '');
                    } else if (data.type === 'decrypt_text') {
                        simularCarga(data.payload.text, null, data.payload.delay || 1800);
                    } else if (data.type === 'image') {
                        const imgElem = crearElementoImagen(data.payload.url, data.payload.caption);
                        if (data.payload.delay) {
                            simularCarga(null, imgElem, data.payload.delay);
                        } else {
                            historial.appendChild(imgElem);
                            window.scrollTo(0, document.body.scrollHeight);
                        }
                    } else if (data.type === 'doc_embed' || data.type === 'photo_album' || data.type === 'album') {
                        const albumElem = crearElementoAlbum(data.payload);
                        historial.appendChild(albumElem);
                        window.scrollTo(0, document.body.scrollHeight);
                    }

                } catch (err) {
                    imprimir(`[FALLO CRÍTICO] Pérdida de sincronización con la base forense local.`, 'alerta');
                }
            }
        });
    </script>
</body>
